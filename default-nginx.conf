server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.html;

    # 记账软件前端
    location /accounting/ {
        alias /opt/accounting/web/;
        index index.html;
        try_files $uri $uri/ /accounting/index.html;
    }

    # 记账软件API
    location /accounting/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket 终端代理
    location /api/terminal/ws {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 普通 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ToolHub API 代理
    location /toolhub/api/ {
        proxy_pass http://127.0.0.1:9002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ToolHub 静态文件
    location /toolhub/ {
        alias /home/toolhub/;
        index index.html;
        try_files $uri $uri/ /toolhub/index.html;
    }

    # Wallpaper API 代理到 Flask
    location /wallpaper/api/ {
        proxy_pass http://127.0.0.1:9003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }

    # Wallpaper 静态文件（上传的图片）
    location /wallpaper/uploads/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Wallpaper 精确匹配（无尾部斜杠时重定向）
    location = /wallpaper {
        return 301 /wallpaper/;
    }

    # Wallpaper 静态文件
    location /wallpaper/ {
        alias /usr/share/nginx/wallpaper/;
        index index.html;
        try_files $uri $uri/ /wallpaper/index.html;
    }

    # 静态文件
    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 禁用静态文件直接访问（已代理到后端）
    location /static-files-disabled {
        try_files $uri $uri/ =404;
    }
}
